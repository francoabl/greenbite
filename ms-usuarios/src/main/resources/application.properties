spring.application.name=ms-usuarios

# Puerto del microservicio (equivalente a PORT en la version Node)
server.port=${PORT:4001}

# Conexion a PostgreSQL (usuarios_db, expuesto en el 5433 por docker-compose)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/usuarios_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate: crea/actualiza las tablas automaticamente segun las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Secreto para firmar los JWT (equivalente a JWT_SECRET en Node)
app.jwt.secret=${JWT_SECRET:dev_secret_dev_secret_dev_secret_123456}
app.jwt.expiration-ms=7200000
