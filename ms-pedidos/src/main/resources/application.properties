spring.application.name=ms-pedidos

# Puerto del microservicio (equivalente a PORT en la version Node)
server.port=${PORT:4002}

# Conexion a PostgreSQL (pedidos_db, expuesto en el 5434 por docker-compose)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/pedidos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate: crea/actualiza las tablas automaticamente segun las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
